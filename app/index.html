<style>#launch{position:fixed;inset:0;z-index:200;background:#86c9de center/cover no-repeat;transition:opacity .65s cubic-bezier(.2,.8,.2,1),filter .65s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1);cursor:pointer}#launch video{width:100%;height:100%;object-fit:cover;display:block}#launch.out{opacity:0;filter:blur(14px);transform:scale(1.04);pointer-events:none}@media (prefers-reduced-motion:reduce){#launch{transition:opacity .25s}#launch.out{filter:none;transform:none}}#launch .tap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);display:flex;justify-content:center;pointer-events:none}#launch .tap span{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 22px;border-radius:999px;font:600 15px/1 Inter,system-ui,sans-serif;letter-spacing:.02em;color:#fff;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 10px 30px rgba(0,40,70,.18);opacity:0;transform:translateY(10px) scale(.98);transition:opacity .6s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1)}#launch .tap i{width:8px;height:8px;border-radius:4px;background:#fff;box-shadow:0 0 12px #fff}#launch.wait .tap span{opacity:1;transform:none}#launch.wait .tap i{animation:lTap 2.2s ease-in-out infinite}@keyframes lTap{50%{opacity:.35;transform:scale(.7)}}#launch:focus{outline:none}#launch:focus-visible .tap span{box-shadow:inset 0 0 0 2px #fff}@media (prefers-reduced-motion:reduce){#launch.wait .tap i{animation:none}}#promo{position:fixed;inset:0;z-index:210;background:#060b1c;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .5s cubic-bezier(.2,.8,.2,1)}#promo.on{opacity:1}#promo.out{opacity:0;pointer-events:none}#promo video{width:100%;height:100%;object-fit:contain;display:block}#promo button{position:absolute;z-index:2;height:40px;padding:0 16px;border:0;border-radius:999px;font:600 14px/1 Inter,system-ui,sans-serif;color:#fff;background:rgba(10,18,32,.4);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);cursor:pointer}#promo .pskip{right:16px;top:calc(env(safe-area-inset-top,0px) + 12px)}#promo .psnd{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%)}</style>
</head>
<body>
<div id="launch" aria-hidden="true"><video muted playsinline preload="auto"></video><div class="tap"><span><i></i><b>Klepni pro vstup</b></span></div></div>
<script>(function () {
  var L = document.getElementById('launch'); if (!L) return;
  var V = L.querySelector('video'), T = L.querySelector('.tap span b');
  var wide = innerWidth > innerHeight, base = '' + (wide ? 'launch-land' : 'launch-portrait');
  if (T && matchMedia('(hover: hover) and (pointer: fine)').matches) T.textContent = 'Klikni pro vstup';
  L.style.backgroundImage = 'url(' + base + '-first.jpg)';
  var last = 0, ver = '';
  try { last = +localStorage.getItem('aur' + 'Seen') || 0; ver = localStorage.getItem('aur' + 'V') || ''; } catch (e) {}
  var fresh = !last && !ver; /* nobody has opened Aurora in this browser before */
  var RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var full = Date.now() - last > 36e5 || ver !== '19.2';
  var ended = false, waiting = false;
  function done() { if (ended) return; ended = true; L.classList.add('out'); L.classList.remove('wait'); try { dispatchEvent(new Event('aurlaunch')); } catch (e) {} removeEventListener('keydown', key); setTimeout(function () { L.remove(); }, 700); }
  /* full intro: it stays on the logo until the person taps */
  function wait(stillToo) { if (ended || waiting) return; waiting = true; if (stillToo || !V || V.readyState < 2) { L.style.backgroundImage = 'url(' + base + '-last.jpg)'; if (V) V.style.opacity = '0'; }
    L.classList.add('wait'); L.setAttribute('role', 'button'); L.setAttribute('aria-hidden', 'false'); L.setAttribute('aria-label', T ? T.textContent : 'Vstoupit'); L.tabIndex = 0; try { L.focus({ preventScroll: true }); } catch (e) {} }
  function quick() { if (V) V.remove(); L.style.backgroundImage = 'url(' + base + '-last.jpg)'; setTimeout(done, RM ? 120 : 380); }
  function key(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(); } else if (e.key === 'Escape') { e.preventDefault(); done(); } }
  function mark() { try { localStorage.setItem('aur' + 'Seen', Date.now()); localStorage.setItem('aur' + 'V', '19.2'); } catch (e) {} }
  /* v19.1: for new people the 26 s video plays once, right after the tap (the tap is what lets it play with sound) */
  function promo() {
    try { if (localStorage.getItem('aur' + 'Promo')) return; localStorage.setItem('aur' + 'Promo', '1'); } catch (e) { return; }
    if (!fresh) return; /* new people only */
    var cs = /^cs|^sk/i.test(navigator.language || ''), P = document.createElement('div'); P.id = 'promo';
    P.innerHTML = '<video playsinline preload="auto" src="promo.mp4?v=1" poster="promo-poster.jpg?v=2"></video><button class="pskip" type="button">' + (cs ? 'Přeskočit' : 'Skip') + '</button><button class="psnd" type="button" hidden>' + (cs ? 'Zapnout zvuk' : 'Turn sound on') + '</button>';
    document.body.appendChild(P); var v = P.querySelector('video'), s = P.querySelector('.psnd'), over = false;
    function end() { if (over) return; over = true; P.classList.add('out'); try { v.pause(); } catch (e) {} setTimeout(function () { P.remove(); try { dispatchEvent(new Event('aurpromo')); } catch (e) {} }, 520); }
    v.addEventListener('ended', end); v.addEventListener('error', end); P.querySelector('.pskip').addEventListener('click', end);
    s.addEventListener('click', function () { v.muted = false; s.hidden = true; });
    requestAnimationFrame(function () { P.classList.add('on'); });
    var pr = v.play(); if (pr && pr.catch) pr.catch(function () { v.muted = true; s.hidden = false; v.play().catch(end); });
  }
  function enter() { var first = !ended; done(); if (first) promo(); }
  window.__launchDone = done;
  mark(); document.addEventListener('visibilitychange', function () { if (document.hidden) mark(); }); addEventListener('pagehide', mark);
  L.addEventListener('click', enter);
  if (full) {
    addEventListener('keydown', key);
    if (RM) { wait(true); return; }
    V.src = base + '.mp4';
    V.addEventListener('ended', function () { wait(false); });
    V.addEventListener('error', function () { wait(true); });
    var p = V.play(); if (p && p.catch) p.catch(function () { wait(true); });
    setTimeout(function () { wait(V.paused && V.currentTime < 3); }, 5200);
  } else quick();
})();</script>
